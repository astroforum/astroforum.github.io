# Three-step approach shown on the home page
- title: Design
  desc: Thermodynamics-based alloy design that maps composition, microstructure and properties
  desc_ko: 열역학에 기반해 조성–미세조직–물성의 관계를 설계
- title: Process
  desc: Making the alloys ourselves, from melting and casting to dealloying and composites
  desc_ko: 용해·주조부터 탈합금, 복합재 제조까지 직접 합금을 제조
- title: Evaluate
  desc: Microstructure analysis and mechanical testing under demanding conditions
  desc_ko: 미세조직 분석과 가혹 환경에서의 기계적 특성 평가
- title: Application
  desc: Robust alloys for extreme environments such as aerospace, nuclear energy and hydrogen
  desc_ko: 항공우주, 원자력, 수소 등 극한 환경에 쓰이는 견고한 합금으로 연결
