<!doctype html>
<html lang="ko">
<head>

        <div class="card">
          <h3>Email</h3>
          <p class="todo">[email@university.ac.kr]</p>
        </div>
        <div class="card">
          <h3>Phone</h3>
          <p class="todo">[+82-XX-XXXX-XXXX]</p>
        </div>
      </div>

      <h2>Join Us</h2>
      <p class="todo">[대학원생/학부연구생 모집 안내 — 관심 있는 학생은 CV와 함께 이메일로 연락 등]</p>
