  <g stroke="#4a2a1c" stroke-opacity="0.35" stroke-width="2">
    <line x1="50" y1="490" x2="550" y2="490"/>
    <line x1="50" y1="540" x2="550" y2="540"/>
    <line x1="50" y1="590" x2="550" y2="590"/>
