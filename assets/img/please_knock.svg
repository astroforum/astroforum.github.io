      <stop offset="0" stop-color="#7a4a33"/>
      <stop offset="1" stop-color="#5e3726"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="#f4f1ec"/>
  <!-- twine and nail -->
  <path d="M120 470 L300 170 L480 470" fill="none" stroke="#b08a5a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="165" r="10" fill="#2b2b2b"/>
  <!-- board -->
