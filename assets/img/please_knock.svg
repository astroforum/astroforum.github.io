  <rect x="68" y="458" width="464" height="214" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="120" cy="470" r="8" fill="#3a2016"/>
  <circle cx="480" cy="470" r="8" fill="#3a2016"/>
  <g fill="#fff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="545" font-size="62" font-weight="500" letter-spacing="3">PLEASE</text>
    <text x="300" y="610" font-size="54" font-weight="500" letter-spacing="3">KNOCK</text>
